---
- name: Validate ee_list entries
  ansible.builtin.assert:
    that:
      - item.name is defined or item.ee_name is defined
    fail_msg: "Each entry in ee_list must have a 'name' (or 'ee_name') field defined. Entry at index {{ ansible_loop.index0 }} is missing it."
    quiet: true
  loop: "{{ ee_list }}"
  loop_control:
    extended: true
    label: "{{ item.name | default(item.ee_name | default('UNNAMED')) }}"

- name: Build EE environments
  ansible.builtin.include_tasks: 00_build_ee.yml
  loop: "{{ ee_list }}"
  loop_control:
    loop_var: __execution_environment_definition
    label: "{{ __execution_environment_definition.name }}"

- name: Push to controller
  when: ee_create_controller_def
  delegate_to: localhost
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: temp
      register: controller_ee

    - name: Create execution environment definition file
      ansible.builtin.template:
        src: ee_controller.yaml.j2
        dest: "{{ controller_ee.path }}/ee_controller.yaml"
        mode: "0644"

    - name: Include templated variables
      ansible.builtin.include_vars:
        file: "{{ controller_ee.path }}/ee_controller.yaml"

    - name: Display templated variables
      ansible.builtin.debug:
        var: controller_execution_environments

    - name: Remove temporary directory
      ansible.builtin.file:
        state: absent
        path: "{{ controller_ee.path }}"

    - name: Set stats for use in another workflow node
      ansible.builtin.set_stats:
        data:
          controller_execution_environments: "{{ controller_execution_environments }}"

  always:
    - name: Clean up controller temporary directory
      ansible.builtin.file:
        state: absent
        path: "{{ controller_ee.path }}"
      when: controller_ee.path is defined
...
