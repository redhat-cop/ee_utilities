---
name: Run Test of EE utilities
on: [push]

permissions:
  contents: read

jobs:
  Integration-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install podman
        run: sudo apt -y install podman

      - name: Install Ansible and Ansible Builder
        run: pip install --upgrade setuptools ansible-core ansible-builder

      - name: Move ansible.cfg to root
        run: mv .github/files/ansible.cfg .

      - name: Install Dependencies
        run: ansible-galaxy collection install infra.ee_utilities containers.podman -f

      - name: Build EE
        run: ansible-playbook .github/tests/build_ee.yml -e "ee_image_push=false" --connection=local -vvv
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
