ancestor: null
releases:
  2.0.2:
    changes:
      minor_changes:
      - added ability to output controller_configuration execution_environment config
        for created images.
      - added ability to use base and builder images at several levels and updated
        README to be more accurate.
      - added new options from ansible builder.
    fragments:
    - changes.yml
    release_date: '2022-12-01'
  2.0.3:
    changes:
      bugfixes:
      - Fixed issue where ansible.cfg file was not being consumed by the builder.
    fragments:
    - config_file_fix.yml
    release_date: '2022-12-05'
  2.0.4:
    changes:
      minor_changes:
      - Removed ee_create_ansible_config in favour of ee_pull_collections_from_hub
        in ee_builder role.
    release_date: '2022-12-06'
  2.0.5:
    changes:
      breaking_changes:
      - renaming ee_name to name in the ee_list variable
      bugfixes:
      - bug not removing ee_controller.yaml file
      - bug when multiple EEs in ee_list would fail when ee_builder_dir_clean was
        true
    fragments:
    - fixes.yml
    release_date: '2023-01-17'
  2.0.6:
    release_date: '2023-01-26'
  2.0.7:
    changes:
      minor_changes:
      - Added changed_when false to built in commands that gather information.
    fragments:
    - changed_when_lint.yml
    release_date: '2023-03-13'
  2.0.8:
    changes:
      minor_changes:
      - Added changed_when false to built in commands that gather information.
    fragments:
    - changed_when_lint.yml
    release_date: '2023-06-25'
  3.0.0:
    changes:
      breaking_changes:
      - Check the ee_builder documentation for updated vars, All dependency files
        moved to the dependency variable. Other options moved to their respective
        places as well.
      - Updated the venv role to use v3 format, updated the documentation on this
        role as well.
      - builder role rewritten from ground up to match the v3 ansible-builder structure.
        This has simplified many of the previous variables, allowing for more customization
        and allows for adaptability of future updates without code changes.
    fragments:
    - v3_update.yml
    release_date: '2023-07-06'
  3.1.0:
    changes:
      minor_changes:
      - ansible.cfg removed from root and galaxy.yml added to enable install from
        source
    fragments:
    - source_build.yml
    release_date: '2023-08-03'
  3.1.1:
    release_date: '2023-08-03'
  3.1.2:
    changes:
      bugfixes:
      - removed containers.podman dependency. It made it so you could not sync this
        collection to automation hub.
    fragments:
    - dependencies.yml
    release_date: '2023-08-17'
  3.1.3:
    changes:
      bugfixes:
      - Added an option of build_files to the ee definition. This will allow for files/folders
        to be copied to the working directory to be used for build files.
      - Fixed an issue when ee_pull_collections_from_hub was set to true, and build_steps
        were not defined, an error was raised.
    fragments:
    - build_fixes.yml
    release_date: '2023-12-02'
  4.0.0:
    changes:
      breaking_changes:
      - update execution_environment.yml to execution-environment.yaml to be in line
        with the ansible-builder default. Only affects files generated. Any user-defined
        automation depending on this file will need to be updated.
      bugfixes:
      - Fixed an issue where a tempfile was not created locally, but rather on the
        remote machine
      - Fixed an issue where depending on your ee base image variable location, it
        might not pull the correct image.
      - Fixed issue where the base image name was not able to be set for individual
        ee
      - found some typoes in readme and corrected them.
      minor_changes:
      - adds an ee_aap_version var to allow for pushing collections to either AAP
        2.4 or 2.5
      - updated 'ee_ah_host' and 'ee_ah_token' to also take aap_hostname and aap_token
        as defaults, updated readme to reflect new changes.
    fragments:
    - 147-pull-image.yml
    - 148-delegation.yml
    - 173-fix-2.5.yml
    - aap25updates.yml
    - base_image_name.yml
    release_date: '2025-03-07'
  4.0.1:
    changes:
      bugfixes:
      - Fixes issue where ee_builder role concatenates the URL and token on ansible.cfg
    fragments:
    - 189-token-concat.yml
    release_date: '2025-03-26'
  4.0.4:
    changes:
      bugfixes:
      - Allow ee_ah_token to be blank for anonymous access
    fragments:
    - empty_token.yml
    release_date: '2025-06-15'
  4.1.2:
    changes:
      bugfixes:
      - allow for providing the squash option to ansible-builder
      - make ee_builder_dir work with multiple EEs defined in ee_list
    fragments:
    - add_ee_squash_support.yml
    - fix_build_dir.yml
    release_date: '2026-01-01'
  4.2.0:
    changes:
      bugfixes:
      - this should fix the ci action to build and publish an EE with all the collections
      minor_changes:
      - Added support for building and pushing EE images with multiple tags.
    fragments:
    - fix_ee_publish.yml
    - multi-tags.yml
    release_date: '2025-10-15'
  4.2.2:
    changes:
      bugfixes:
      - allow for providing the extra-build-cli-args option to ansible-builder
    fragments:
    - add_ee_extra_build_cli_args_support.yml
    release_date: '2026-01-17'
  4.2.3:
    changes:
      bugfixes:
      - Handle empty build steps in execution-environment.yaml generation
      - use compact loop labels when building, don't print the full EE definition
    fragments:
    - handle_empty_build_steps.yml
    - tweak_loop_label.yml
    release_date: '2026-03-01'
  4.2.5:
    changes:
      bugfixes:
      - remove possibly created temp directory
      - use correct label when pulling base image, tweak other task names
    fragments:
    - remove_temp_dir.yml
    - tweak_tasks_labels.yml
    - update-pre-commit.yml
    release_date: '2026-04-16'
